# Builds the Store package on every release tag and keeps it as a workflow artifact.
# Publishing to the Store runs only when the four Partner Center secrets exist
# (development_guides/store_guide.md, section 4); until then the job just builds.
name: msix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet run tools/build_msix.cs

      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: dist/*.msix
          if-no-files-found: error

      - name: Set up the Store CLI
        if: startsWith(github.ref, 'refs/tags/v') && env.TENANT != ''
        env:
          TENANT: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Publish to the Store
        if: startsWith(github.ref, 'refs/tags/v') && env.TENANT != ''
        env:
          TENANT: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
        shell: pwsh
        run: |
          msstore reconfigure --tenantId "${{ secrets.PARTNER_CENTER_TENANT_ID }}" --sellerId "${{ secrets.PARTNER_CENTER_SELLER_ID }}" --clientId "${{ secrets.PARTNER_CENTER_CLIENT_ID }}" --clientSecret "${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}"
          $msix = (Get-ChildItem dist/*.msix).FullName
          msstore publish --inputFile $msix --appId "${{ secrets.PARTNER_CENTER_APP_ID }}"
